# ==============================================================================
# Tarang (Signal Speak Studio) — Production Docker Compose
# Oracle Cloud Always Free ARM VM
# Usage: docker compose --env-file .env.production up -d --build
# ==============================================================================

services:
  # 1. Main Web Application (TanStack Start SSR)
  trounce-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trounce_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://trounce-mongo:27017/tarang
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-tarang}
      WHISPER_SIDECAR_URL: http://trounce-sidecar:8765
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - audio_storage:/app/.storage/audio
    depends_on:
      trounce-mongo:
        condition: service_healthy
      trounce-sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 2. Local AI Speech Recognition Sidecar (Offline FastWhisper)
  trounce-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: trounce_sidecar
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_HOST: "0.0.0.0"
      WHISPER_PORT: "8765"
      WHISPER_LANG: en
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8765/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  # 3. Persistent Database (MongoDB 6.0)
  trounce-mongo:
    image: mongo:6.0
    container_name: trounce_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  audio_storage:
  whisper_cache:
  mongo_data:
