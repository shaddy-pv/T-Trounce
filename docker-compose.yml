# ==============================================================================
# Trounce: multi-container production composition
# Self-hostable stack. Only the web app is published on the host; MongoDB and the
# sidecar are reachable only from inside the Compose network, because the MongoDB
# image below runs without authentication.
#
# Required in .env next to this file: SESSION_SECRET, ADMIN_EMAIL, ADMIN_INITIAL_PASSWORD
# ==============================================================================

services:
  # 1. Main web application
  trounce-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trounce_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://trounce-mongo:27017/trounce
      - MONGODB_DB_NAME=trounce
      - WHISPER_SIDECAR_URL=http://trounce-sidecar:8765
      - WHISPER_SIDECAR_TOKEN=${WHISPER_SIDECAR_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Set to 1 when a reverse proxy (nginx, Caddy, a cloud load balancer) is in front of this container.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
    volumes:
      - audio_storage:/app/.storage/audio
    depends_on:
      trounce-mongo:
        condition: service_healthy
      trounce-sidecar:
        condition: service_started

  # 2. Speech recognition sidecar (offline FastWhisper)
  trounce-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: trounce_sidecar
    restart: always
    expose:
      - "8765"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_HOST=0.0.0.0
      - WHISPER_PORT=8765
      - WHISPER_SIDECAR_TOKEN=${WHISPER_SIDECAR_TOKEN:-}
    volumes:
      - whisper_cache:/home/whisper/.cache/huggingface

  # 3. Persistent database (MongoDB)
  trounce-mongo:
    image: mongo:7.0
    container_name: trounce_mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  audio_storage:
  whisper_cache:
  mongo_data:
