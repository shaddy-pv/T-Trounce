<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100E0C" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>You're offline · Trounce</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #100e0c;
        color: #ede7dd;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #1b1815;
        border: 1px solid #2e2a26;
        border-radius: 12px;
        padding: 32px 24px;
      }
      .signal {
        width: 12px;
        height: 12px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #c1503b;
      }
      .signal.online {
        background: #3fb8af;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #9c9388;
        margin-bottom: 24px;
      }
      button {
        background-color: #3fb8af;
        color: #100e0c;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:focus-visible {
        outline: 2px solid #3fb8af;
        outline-offset: 2px;
      }
      .status {
        font-size: 12px;
        color: #9c9388;
        margin-top: 16px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="signal" id="signal" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>
        Trounce needs an internet connection to load your practice and save your recordings. Check
        your Wi-Fi or mobile data and try again.
      </p>
      <button type="button" id="retry">Try again</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var status = document.getElementById("status");
        var signal = document.getElementById("signal");

        function reconnect() {
          signal.classList.add("online");
          status.textContent = "Connection restored. Reloading...";
          setTimeout(function () {
            window.location.reload();
          }, 400);
        }

        document.getElementById("retry").addEventListener("click", function () {
          if (navigator.onLine) {
            reconnect();
          } else {
            status.textContent = "Still offline. Please check your connection.";
          }
        });

        window.addEventListener("online", reconnect);
      })();
    </script>
  </body>
</html>
